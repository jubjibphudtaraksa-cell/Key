name: Build KeyCompass
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o KeyCompass-1.0.0-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: KeyCompass/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: KeyCompass
      - uses: actions/upload-artifact@v4
        with:
          name: KeyCompass
          path: KeyCompass/KeyCompass-1.0.0.jar
